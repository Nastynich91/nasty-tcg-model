name: Keepalive & Snapshot

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          for i in 1 2 3; do
            echo "Ping attempt $i"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 90 \
              "https://nasty-tcg-model-9evovtum4mtmmeappteoruq.streamlit.app" || true
            sleep 15
          done
          echo "Done - snapshot triggered"
